<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Component Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <!-- HTMX gives us live search and quantity steppers without writing JS. -->
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="logo">⚡</span> Component Tracker
    </a>
    <nav class="nav">
      <a href="{{ url_for('index') }}">Inventory</a>
      <a href="{{ url_for('low_stock') }}">Low stock</a>
      <a href="{{ url_for('builds') }}">Builds</a>
      <a href="{{ url_for('export_csv') }}">Export CSV</a>
      <a class="primary" href="{{ url_for('import_home') }}">Import BOM</a>
    </nav>
  </header>

  <main class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
